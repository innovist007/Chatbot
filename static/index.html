  <style>

    :root {
  /* Light theme - matching dashboard */
  --bg: #fafafa;
  --sidebar-bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f5f5;
  --surface-3: #efefef;
  --border: #e5e5e5;
  --border-strong: #d4d4d4;
  --text: #171717;
  --text-2: #525252;
  --muted: #737373;
  --dim: #a3a3a3;
  --accent: #3b82f6;
  --accent-2: #2563eb;
  --accent-soft: #eff6ff;
  --accent-border: rgba(59, 130, 246, 0.2);
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  /* ... rest stays same */
}

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }

    /* ==================== Layout ==================== */
    .app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      overflow-y: auto;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      cursor: pointer;
    }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent-grad);
      display: grid; place-items: center;
      box-shadow: 0 0 24px rgba(167, 139, 250, 0.35);
    }
    .brand-text { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .new-chat {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.15s;
    }
    .new-chat:hover {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .sidebar-section { margin-top: 22px; }
    .sidebar-section h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 8px 8px;
    }

    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      width: 100%;
    }
    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: rgba(167, 139, 250, 0.3);
    }
    .nav-item svg { color: var(--accent); flex-shrink: 0; }

    .example-list { display: flex; flex-direction: column; gap: 4px; }
    .example {
      text-align: left;
      padding: 8px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .example:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .history-list { display: flex; flex-direction: column; gap: 2px; }
    .history-item {
      padding: 7px 10px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover { background: var(--surface-2); color: var(--text); }

    .agent-info-card {
      margin-top: auto;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .agent-info-label {
      color: var(--muted); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 4px;
    }
    .agent-info-name {
      color: var(--text); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .agent-status {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 6px; font-size: 11px; color: var(--success);
    }
    .agent-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    /* ==================== Main + Workspace ==================== */
 /* ==================== Main + Workspace ==================== */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 0 0;
      overflow: hidden;
      transition: grid-template-columns 0.25s ease;
      min-height: 0;
    }
    .workspace.dashboard-mode {
      grid-template-columns: 1fr 6px var(--side-chat-w);
    }
    .workspace.dashboard-mode.chat-collapsed {
      grid-template-columns: 1fr 0 0;
    }
    .workspace.dragging { transition: none; }
    .workspace.dragging iframe { pointer-events: none; }

     .resizer {
      display: none;
      cursor: col-resize;
      background: var(--border);
      position: relative;
      transition: background 0.15s;
    }
    .workspace.dashboard-mode .resizer { display: block; }
    .resizer:hover, .resizer.active { background: var(--accent); }
    .resizer::before {
      content: '';
      position: absolute;
      inset: 0 -4px;     /* widen hit-area without changing visible width */
    }
    .resizer::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 36px;
      background: var(--border-strong);
      border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    .resizer:hover::after, .resizer.active::after { background: white; }

    /* Center pane: chat OR dashboard */
    .center-pane {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .dashboard-pane {
      display: none;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    /* CHAT PANE — must always be flex when visible so the composer pins
       to the bottom and the messages area scrolls. */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    /* Hide chat pane when in dashboard mode */
    .workspace.dashboard-mode .chat-pane { display: none; }
    /* Show dashboard pane when in dashboard mode */
    .workspace.dashboard-mode .dashboard-pane { display: flex; }

    /* Side chat */
    .side-chat {
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: none;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .workspace.dashboard-mode:not(.chat-collapsed) .side-chat { display: flex; }

    /* Messages area — must be scrollable, must take remaining height */
    .messages {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 32px 24px 120px;
      scroll-behavior: smooth;
      min-height: 0;
    }
    .messages-inner { max-width: 880px; margin: 0 auto; }
    .side-chat .messages { padding: 20px 16px 110px; }
    .side-chat .messages-inner { max-width: 100%; }
    .side-chat .composer-wrap { padding: 12px 16px 16px; }

    /* Pane header — fixed height, doesn't grow */
    .pane-header {
      flex: 0 0 auto;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 5;
    }
    .pane-title { font-weight: 600; font-size: 14px; }
    .pane-sub { color: var(--muted); font-size: 12px; }

    .header-btn {
      padding: 7px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .header-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }

    /* Dashboard iframe */
    .dashboard-frame-wrap {
      flex: 1;
      background: #1a1a25;
      position: relative;
    }
    .dashboard-frame-wrap iframe {
      width: 100%; height: 100%;
      border: 0;
      display: block;
    }
    .dashboard-empty {
      flex: 1;
      display: grid; place-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* Chat (used in both full and side-panel mode) */
    .chat-pane {
      flex: 1;
      display: flex; flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .side-chat {
      width: var(--side-chat-w);
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: none;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
      min-width: 0;
    }
    .workspace.dashboard-mode .side-chat { display: flex; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px 120px;
      scroll-behavior: smooth;
    }
    .messages-inner { max-width: 880px; margin: 0 auto; }
    /* Tighter padding when chat is in side panel */
    .side-chat .messages { padding: 20px 16px 110px; }
    .side-chat .messages-inner { max-width: 100%; }
    .side-chat .composer-wrap { padding: 12px 16px 16px; }

    /* Welcome */
    .welcome {
      max-width: 720px; margin: 60px auto 0;
      text-align: center;
    }
    .side-chat .welcome { margin-top: 24px; }
    .welcome-icon {
      width: 56px; height: 56px;
      background: var(--accent-grad);
      border-radius: 16px;
      display: grid; place-items: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 40px rgba(167, 139, 250, 0.4);
    }
    .welcome h1 {
      font-size: 28px; font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    .side-chat .welcome h1 { font-size: 18px; }
    .welcome p { color: var(--text-2); margin: 0 0 32px; font-size: 15px; }
    .side-chat .welcome p { font-size: 13px; margin-bottom: 20px; }
    .suggest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 640px; margin: 0 auto;
    }
    .side-chat .suggest-grid { grid-template-columns: 1fr; }
    .suggest {
      text-align: left;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      transition: all 0.15s;
    }
    .suggest:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .suggest-label {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    /* Messages */
    .msg { margin-bottom: 28px; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      max-width: 75%;
      padding: 12px 16px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      border-radius: 16px 16px 4px 16px;
      font-size: 14px;
    }

    .msg.agent .agent-row { display: flex; gap: 12px; }
    .agent-avatar {
      width: 32px; height: 32px; flex-shrink: 0;
      background: var(--accent-grad);
      border-radius: 8px;
      display: grid; place-items: center;
      box-shadow: 0 0 16px rgba(167, 139, 250, 0.25);
    }
    .agent-body {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 14px;
    }

    .status-pill {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 11px;
      background: var(--accent-soft);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .status-pill.done {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }
    .status-pill.done .dot { background: var(--success); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Thinking */
    .thinking {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .thinking-header {
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; gap: 8px;
    }
    .thinking-header:hover { background: var(--surface-2); }
    .thinking-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--text-2);
    }
    .thinking-title svg { color: var(--accent); }
    .thinking-count {
      background: var(--surface-3);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px; color: var(--muted);
    }
    .chevron { color: var(--muted); transition: transform 0.2s; }
    .thinking.collapsed .chevron { transform: rotate(-90deg); }
    .thinking-body {
      padding: 4px 16px 14px;
      border-top: 1px solid var(--border);
      max-height: 320px; overflow-y: auto;
    }
    .thinking.collapsed .thinking-body { display: none; }

    .thought-list {
      list-style: none; margin: 0; padding: 8px 0 0;
      position: relative;
    }
    .thought-list::before {
      content: '';
      position: absolute;
      left: 7px; top: 14px; bottom: 6px;
      width: 1px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--border) 100%);
      opacity: 0.4;
    }
    .thought-item {
      position: relative;
      padding: 6px 0 6px 24px;
      font-size: 13px;
      color: var(--text-2);
      animation: fadeInLeft 0.25s ease;
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .thought-item::before {
      content: '';
      position: absolute;
      left: 3px; top: 12px;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--surface);
    }
    .thought-item.streaming::before {
      animation: pulseRing 1.2s infinite;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 0 rgba(167, 139, 250, 0.6); }
      100% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 8px rgba(167, 139, 250, 0); }
    }

    .answer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .answer-content { font-size: 14px; line-height: 1.65; color: var(--text); }
    .answer-content > *:first-child { margin-top: 0; }
    .answer-content > *:last-child { margin-bottom: 0; }
    .answer-content h1, .answer-content h2, .answer-content h3 {
      margin: 16px 0 8px; font-weight: 600;
    }
    .answer-content h3 { font-size: 14px; color: var(--accent); }
    .answer-content p { margin: 8px 0; }
    .answer-content ul, .answer-content ol { margin: 8px 0; padding-left: 22px; }
    .answer-content li { margin: 4px 0; }
    .answer-content code {
      background: var(--surface-3); padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--accent);
    }
    .answer-content strong { color: var(--text); font-weight: 600; }

    .output-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .output-header {
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; cursor: pointer; user-select: none;
    }
    .output-header:hover { background: var(--surface-2); }
    .output-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600;
    }
    .output-title svg { color: var(--accent); }
    .output-meta { font-size: 12px; color: var(--muted); }
    .output-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 28px; height: 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-2);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--surface-3); color: var(--text); }
    .output-body { border-top: 1px solid var(--border); }
    .output-card.collapsed .output-body { display: none; }
    .output-card.collapsed .chevron { transform: rotate(-90deg); }

    .chart-container {
      padding: 16px;
      background: radial-gradient(ellipse at top, rgba(167, 139, 250, 0.04) 0%, transparent 60%);
    }
    .chart-container .vega-embed { width: 100%; }

    .data-wrap { max-height: 380px; overflow: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th {
      position: sticky; top: 0;
      background: var(--surface-2);
      padding: 10px 14px;
      text-align: left; font-weight: 500;
      color: var(--muted); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr:hover td { background: var(--surface-2); }
    .num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    .sql-block {
      margin: 0; padding: 14px 16px;
      background: var(--surface-2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; line-height: 1.6;
      overflow-x: auto;
    }
    .sql-block code { background: transparent !important; padding: 0 !important; }

    .follow-ups { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
    .chip svg { color: var(--accent); }

    .composer-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px 24px;
      background: linear-gradient(180deg, transparent, var(--bg) 30%);
      pointer-events: none;
    }
    .composer {
      max-width: 880px; margin: 0 auto;
      pointer-events: auto;
      display: flex; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
    }
    .composer input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: inherit; padding: 8px 0;
    }
    .composer input::placeholder { color: var(--muted); }
    .send-btn {
      width: 36px; height: 36px;
      background: var(--accent-grad);
      border: none; border-radius: 9px;
      color: white; cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.15s, opacity 0.15s;
    }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:disabled {
      background: var(--surface-3); color: var(--muted);
      cursor: not-allowed; transform: none;
    }

    .error-card {
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius);
      color: #fca5a5;
      font-size: 13px;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--surface-3); border-radius: 10px;
      border: 2px solid var(--bg);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    @media (max-width: 1100px) {
      :root { --side-chat-w: 360px; }
    }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .workspace.dashboard-mode { grid-template-columns: 1fr; }
      .workspace.dashboard-mode .side-chat {
        position: fixed; inset: 0; left: auto;
        z-index: 100; box-shadow: -6px 0 24px rgba(0, 0, 0, 0.5);
      }
    }
  </style>
</head>
<body>

  <script>
    const ICONS = {

    // -----------------------------------------------------------

  <script>
    const $ = (sel) => document.querySelector(sel);
    const messagesMain = $("#messages-main");
    const messagesSide = $("#messages-side");
    const messagesMainInner = $("#messages-main-inner");
    const messagesSideInner = $("#messages-side-inner");
    const workspace = $("#workspace");

    const state = {
      streaming: false,
      messages: [],
      history: [],
      mode: "chat",     // "chat" | "dashboard"
      activeDashId: null,
    };

    // ---------- Init ----------
    init();

    // -------- Resizer (drag to resize side chat) --------
    (function setupResizer() {
      const resizer = document.getElementById("resizer");
      const ws = workspace;
      const MIN = 280, MAX_FRAC = 0.6;   // chat min 280px, max 60% of viewport

      let dragging = false;

      resizer.addEventListener("mousedown", (e) => {
        if (!ws.classList.contains("dashboard-mode")) return;
        dragging = true;
        ws.classList.add("dragging");
        resizer.classList.add("active");
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const total = ws.getBoundingClientRect().width;
        const fromRight = total - (e.clientX - ws.getBoundingClientRect().left);
        const clamped = Math.max(MIN, Math.min(total * MAX_FRAC, fromRight));
        document.documentElement.style.setProperty("--side-chat-w", clamped + "px");
      });

      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        ws.classList.remove("dragging");
        resizer.classList.remove("active");
      });

      // Double-click to reset width
      resizer.addEventListener("dblclick", () => {
        document.documentElement.style.setProperty("--side-chat-w", "420px");
      });
    })();

    // -------- Hide / show side chat --------
    function toggleSideChat() {
      const collapsed = workspace.classList.toggle("chat-collapsed");
      document.getElementById("toggle-chat-label").textContent =
        collapsed ? "Show chat" : "Hide chat";
    }

    async function init() {
      renderDashboards();
      renderExamples();
      renderWelcome();

      try {
        const r = await fetch("/chat/agent");
        if (r.ok) {
          const info = await r.json();
          $("#agent-name").textContent = info.display_name || (info.name || "").split("/").pop();
        }
      } catch {}

      $("#composer-main").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("#q-main").value.trim();
        if (v && !state.streaming) { $("#q-main").value = ""; send(v); }
      });
      $("#composer-side").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("#q-side").value.trim();
        if (v && !state.streaming) { $("#q-side").value = ""; send(v); }
      });

      $("#brand").addEventListener("click", exitDashboardMode);
    }

    function renderDashboards() {
      $("#dashboards").innerHTML = DASHBOARDS.map(d => `
        <button class="nav-item" data-id="${d.id}" onclick="openDashboard('${d.id}')">
          ${ICONS.dash} <span>${escapeHtml(d.name)}</span>
        </button>
      `).join("");
    }

    function renderExamples() {
      $("#examples").innerHTML = EXAMPLES.map(ex =>
        `<button class="example" onclick='send(${JSON.stringify(ex.text)})'>${escapeHtml(ex.text)}</button>`
      ).join("");
    }

    function renderWelcome() {
      const html = `
        <div class="welcome">
          <div class="welcome-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
            </svg>
          </div>
          <h1>What would you like to know?</h1>
          <p>Ask about your data in plain English. The agent writes the SQL, runs it, and shows charts and insights.</p>
          <div class="suggest-grid">
            ${EXAMPLES.map(ex => `
              <button class="suggest" onclick='send(${JSON.stringify(ex.text)})'>
                <div class="suggest-label">${ex.label}</div>
                ${escapeHtml(ex.text)}
              </button>
            `).join("")}
          </div>
        </div>
      `;
      messagesMainInner.innerHTML = html;
      messagesSideInner.innerHTML = `
        <div class="welcome">
          <div class="welcome-icon" style="width:40px;height:40px;border-radius:12px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
          </div>
          <h1>Ask about this data</h1>
          <p>Use the chat to drill into the dashboard.</p>
        </div>
      `;
    }

    // ---------- Dashboard mode ----------
    function openDashboard(id) {
      const dash = DASHBOARDS.find(d => d.id === id);
      if (!dash) return;
      state.mode = "dashboard";
      state.activeDashId = id;

      workspace.classList.add("dashboard-mode");

      $("#dash-title").textContent = dash.name;
      $("#dash-sub").textContent = dash.description || "";

      const wrap = $("#dash-frame-wrap");
      if (dash.embedUrl) {
        wrap.innerHTML = `<iframe src="${dash.embedUrl}" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
      } else {
        wrap.innerHTML = `
          <div class="dashboard-empty" style="flex-direction:column;gap:8px;text-align:center;padding:40px;">
            <div style="font-size:15px;color:var(--text);">No embed URL configured</div>
            <div style="font-size:12px;max-width:420px;line-height:1.5;">
              Edit the <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px;">DASHBOARDS</code> list in <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px;">static/index.html</code> and paste your Power BI publish-to-web URL into the <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px;">embedUrl</code> field for "${escapeHtml(dash.name)}".
            </div>
          </div>
        `;
      }

      // Highlight active sidebar item
      document.querySelectorAll(".nav-item").forEach(el => {
        el.classList.toggle("active", el.dataset.id === id);
      });

      // Move existing chat history into both panes (they share state.messages but each rendered independently)
      // Simpler approach: clear side messages on entry, repopulate from state
      reflowChat();
    }

    function exitDashboardMode() {
      state.mode = "chat";
      state.activeDashId = null;
      workspace.classList.remove("dashboard-mode");
      document.querySelectorAll(".nav-item.active").forEach(el => el.classList.remove("active"));
    }

    /** When mode toggles, re-render the chat history into the now-visible pane. */
    function reflowChat() {
      // The 'live' pane is wherever the user will see chat next.
      // Easiest: render a static snapshot in both, but only the visible one is interactive.
      // Since rebuilding live event subscribers for in-flight streams is complex, we
      // simply mirror messages from state.
      const renderInto = (innerEl) => {
        if (!state.messages.length) {
          // Show appropriate welcome
          innerEl === messagesMainInner ? renderWelcome() : null;
          if (innerEl === messagesSideInner) {
            innerEl.innerHTML = `<div class="welcome"><div class="welcome-icon" style="width:40px;height:40px;border-radius:12px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></div><h1>Ask about this data</h1><p>Use the chat to drill into the dashboard.</p></div>`;
          }
          return;
        }
        innerEl.innerHTML = "";
        for (const m of state.messages) {
          if (m.role === "user") {
            const el = document.createElement("div");
            el.className = "msg user";
            el.innerHTML = `<div class="bubble">${escapeHtml(m.text)}</div>`;
            innerEl.appendChild(el);
          } else if (m.role === "agent") {
            innerEl.appendChild(buildStaticAgentMessage(m));
          }
        }
      };
      renderInto(messagesMainInner);
      renderInto(messagesSideInner);
    }

    // ---------- Sending / streaming ----------
    async function send(question) {
      if (state.streaming) return;
      state.streaming = true;

      if (!state.messages.length) {
        messagesMainInner.innerHTML = "";
        messagesSideInner.innerHTML = "";
      }

      addUserMessageBoth(question);
      state.messages.push({ role: "user", text: question });
      addToHistory(question);

      if (state.messages.filter(m => m.role === "user").length === 1) {
        $("#chat-title").textContent = question.length > 60 ? question.slice(0, 60) + "…" : question;
      }

      // Build agent message in BOTH panes; we'll fan-out events to both.
      const msgs = [createAgentMessage(messagesMainInner), createAgentMessage(messagesSideInner)];
      msgs.forEach(m => m.setStatus("Thinking", "thinking"));

      const stored = { role: "agent", thoughts: [], answer: [], sql: null, data: null, chart: null, follow_ups: [] };

      try {
        const res = await fetch("/chat/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            const t = line.trim();
            if (!t) continue;
            try {
              const ev = JSON.parse(t);
              // Mirror to both
              msgs.forEach(m => m.handleEvent(ev));
              // Persist for replay on mode toggle
              if (ev.type === "thought") stored.thoughts.push(...(ev.parts || []));
              if (ev.type === "answer")  stored.answer.push(...(ev.parts || []));
              if (ev.type === "sql")     stored.sql = ev.sql;
              if (ev.type === "data")    stored.data = ev.rows;
              if (ev.type === "chart")   stored.chart = ev.spec;
              if (ev.type === "follow_ups") stored.follow_ups.push(...(ev.parts || []));
            } catch (err) { console.warn("bad line", t, err); }
          }
        }
        msgs.forEach(m => m.finish());
      } catch (err) {
        msgs.forEach(m => m.error(err.message || String(err)));
      } finally {
        state.streaming = false;
        state.messages.push(stored);
      }
    }

    function addUserMessageBoth(text) {
      [messagesMainInner, messagesSideInner].forEach(target => {
        const el = document.createElement("div");
        el.className = "msg user";
        el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        target.appendChild(el);
      });
      scrollAll();
    }

    function buildStaticAgentMessage(stored) {
      const m = createAgentMessage(document.createElement("div"));
      // Replay events synchronously
      if (stored.thoughts.length) m.handleEvent({ type: "thought", parts: stored.thoughts });
      if (stored.sql)             m.handleEvent({ type: "sql", sql: stored.sql });
      if (stored.data)            m.handleEvent({ type: "data", rows: stored.data });
      if (stored.chart)           m.handleEvent({ type: "chart", spec: stored.chart });
      if (stored.answer.length)   m.handleEvent({ type: "answer", parts: stored.answer });
      if (stored.follow_ups.length) m.handleEvent({ type: "follow_ups", parts: stored.follow_ups });
      m.finish();
      return m.root;
    }

    // ---------- Per-message renderer ----------
    function createAgentMessage(parent) {
      const el = document.createElement("div");
      el.className = "msg agent";
      el.innerHTML = `
        <div class="agent-row">
          <div class="agent-avatar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
          </div>
          <div class="agent-body">
            <div class="status-pill"><span class="dot"></span><span class="status-label">Thinking</span></div>
            <div class="thinking" hidden>
              <div class="thinking-header">
                <div class="thinking-title">${ICONS.brain} <span>Reasoning</span> <span class="thinking-count">0</span></div>
                ${ICONS.chevron}
              </div>
              <div class="thinking-body"><ol class="thought-list"></ol></div>
            </div>
            <div class="answer-card" hidden><div class="answer-content"></div></div>
            <div class="output-card chart-card" hidden>
              <div class="output-header">
                <div class="output-title">${ICONS.chart} <span>Visualization</span></div>
                ${ICONS.chevron}
              </div>
              <div class="output-body"><div class="chart-container"></div></div>
            </div>
            <div class="output-card data-card" hidden>
              <div class="output-header">
                <div class="output-title">${ICONS.table} <span>Data</span> <span class="output-meta data-count"></span></div>
                ${ICONS.chevron}
              </div>
              <div class="output-body"><div class="data-wrap"></div></div>
            </div>
            <div class="output-card sql-card collapsed" hidden>
              <div class="output-header">
                <div class="output-title">${ICONS.code} <span>SQL</span></div>
                <div class="output-actions">
                  <button class="icon-btn copy-sql" title="Copy SQL">${ICONS.copy}</button>
                  ${ICONS.chevron}
                </div>
              </div>
              <div class="output-body"><pre class="sql-block"><code class="language-sql"></code></pre></div>
            </div>
            <div class="follow-ups" hidden></div>
          </div>
        </div>
      `;
      if (parent && parent.appendChild) parent.appendChild(el);
      scrollAll();

      // toggles
      el.querySelector(".thinking-header").addEventListener("click", (e) => {
        e.currentTarget.parentElement.classList.toggle("collapsed");
      });
      el.querySelectorAll(".output-card .output-header").forEach(h => {
        h.addEventListener("click", (e) => {
          if (e.target.closest(".icon-btn")) return;
          e.currentTarget.parentElement.classList.toggle("collapsed");
        });
      });
      const copyBtn = el.querySelector(".copy-sql");
      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const sql = el.querySelector(".sql-block code").textContent;
        navigator.clipboard.writeText(sql);
        const orig = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span style="font-size:11px;">✓</span>';
        setTimeout(() => copyBtn.innerHTML = orig, 1500);
      });

      const refs = {
        statusPill: el.querySelector(".status-pill"),
        statusLabel: el.querySelector(".status-label"),
        thinking: el.querySelector(".thinking"),
        thoughtList: el.querySelector(".thought-list"),
        thinkingCount: el.querySelector(".thinking-count"),
        answerCard: el.querySelector(".answer-card"),
        answerContent: el.querySelector(".answer-content"),
        chartCard: el.querySelector(".chart-card"),
        chartContainer: el.querySelector(".chart-container"),
        dataCard: el.querySelector(".data-card"),
        dataWrap: el.querySelector(".data-wrap"),
        dataCount: el.querySelector(".data-count"),
        sqlCard: el.querySelector(".sql-card"),
        sqlCode: el.querySelector(".sql-block code"),
        followUps: el.querySelector(".follow-ups"),
      };

      let answerParts = [];
      let thoughtCount = 0;
      let lastThoughtEl = null;

      function setStatus(label, kind) {
        refs.statusLabel.textContent = label;
        refs.statusPill.className = "status-pill" + (kind === "done" ? " done" : "");
      }
      function addThoughts(parts) {
        if (refs.thinking.hidden) refs.thinking.hidden = false;
        for (const text of parts) {
          if (lastThoughtEl) lastThoughtEl.classList.remove("streaming");
          const li = document.createElement("li");
          li.className = "thought-item streaming";
          li.textContent = text;
          refs.thoughtList.appendChild(li);
          lastThoughtEl = li;
          thoughtCount++;
        }
        refs.thinkingCount.textContent = thoughtCount;
        scrollAll();
      }
      function setAnswer(parts) {
        answerParts = answerParts.concat(parts);
        refs.answerContent.innerHTML = marked.parse(answerParts.join("\n\n"));
        refs.answerCard.hidden = false;
        scrollAll();
      }
      function setChart(spec) {
        refs.chartCard.hidden = false;
        refs.chartContainer.innerHTML = "";
        const themed = JSON.parse(JSON.stringify(spec));
        themed.background = "transparent";
        themed.config = themed.config || {};
        const overrides = {
          axis:   { labelColor: "#b4b4c0", titleColor: "#ececf1",
                    domainColor: "#383844", gridColor: "#26262f", tickColor: "#383844" },
          legend: { labelColor: "#b4b4c0", titleColor: "#ececf1" },
          title:  { color: "#ececf1" },
          view:   { stroke: "transparent" },
        };
        for (const k of Object.keys(overrides)) {
          themed.config[k] = Object.assign({}, themed.config[k], overrides[k]);
        }
        vegaEmbed(refs.chartContainer, themed, { actions: false, renderer: "svg" })
          .then(() => scrollAll())
          .catch(err => {
            refs.chartContainer.innerHTML =
              `<div style="padding:14px;color:#fca5a5;font-size:13px;">Couldn't render chart: ${escapeHtml(err.message || String(err))}</div>`;
          });
      }
      function setData(rows) {
        refs.dataCard.hidden = false;
        refs.dataCount.textContent = `${rows.length} ${rows.length === 1 ? "row" : "rows"}`;
        const cols = Object.keys(rows[0] || {});
        refs.dataWrap.innerHTML = `
          <table class="data-table">
            <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
            <tbody>${rows.map(r =>
              `<tr>${cols.map(c => {
                const v = r[c];
                const isNum = typeof v === "number";
                return `<td class="${isNum ? "num" : ""}">${formatCell(v)}</td>`;
              }).join("")}</tr>`
            ).join("")}</tbody>
          </table>`;
      }
      function setSql(sql) {
        refs.sqlCard.hidden = false;
        refs.sqlCode.textContent = sql;
        if (window.hljs) hljs.highlightElement(refs.sqlCode);
      }
      function setFollowUps(items) {
        if (!items || !items.length) return;
        refs.followUps.hidden = false;
        refs.followUps.innerHTML = items.map(t =>
          `<button class="chip">${ICONS.arrow} ${escapeHtml(t)}</button>`
        ).join("");
        refs.followUps.querySelectorAll(".chip").forEach((btn, i) => {
          btn.addEventListener("click", () => send(items[i]));
        });
      }
      function handleEvent(ev) {
        switch (ev.type) {
          case "thought":     addThoughts(ev.parts || []); setStatus("Thinking", "thinking"); break;
          case "sql":         setSql(ev.sql); setStatus("Querying database", "thinking"); break;
          case "data":        setData(ev.rows); setStatus("Analyzing results", "thinking"); break;
          case "chart":       setChart(ev.spec); setStatus("Building visualization", "thinking"); break;
          case "answer":      setAnswer(ev.parts || []); setStatus("Writing answer", "thinking"); break;
          case "follow_ups":  setFollowUps(ev.parts || []); break;
          case "error":       error(ev.message || "Unknown error"); break;
        }
      }
      function finish() {
        if (lastThoughtEl) lastThoughtEl.classList.remove("streaming");
        if (!refs.answerCard.hidden) refs.thinking.classList.add("collapsed");
        setStatus("Done", "done");
        scrollAll();
      }
      function error(msg) {
        const errEl = document.createElement("div");
        errEl.className = "error-card";
        errEl.textContent = "Error: " + msg;
        refs.answerCard.replaceWith(errEl);
        setStatus("Failed", "done");
      }

      return { root: el, setStatus, handleEvent, finish, error };
    }

    // ---------- Helpers ----------
    function newChat() {
      state.messages = [];
      $("#chat-title").textContent = "New conversation";
      renderWelcome();
    }
    function addToHistory(q) {
      if (state.history[0] === q) return;
      state.history.unshift(q);
      state.history = state.history.slice(0, 10);
      $("#history-section").hidden = false;
      $("#history").innerHTML = state.history.map(h =>
        `<button class="history-item" onclick='send(${JSON.stringify(h)})' title="${escapeHtml(h)}">${escapeHtml(h)}</button>`
      ).join("");
    }
    function scrollAll() {
      requestAnimationFrame(() => {
        messagesMain.scrollTop = messagesMain.scrollHeight;
        messagesSide.scrollTop = messagesSide.scrollHeight;
      });
    }
    function formatCell(v) {
      if (v == null) return "";
      if (typeof v === "number") return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
      return escapeHtml(String(v));
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }
  </script>
</body>
