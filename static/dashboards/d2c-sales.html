<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D2C Sales Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    :root {
      --bg: #08080c; --surface: #11111a; --surface-2: #181822; --surface-3: #1f1f2b;
      --border: #26262f; --border-strong: #383844;
      --text: #ececf1; --text-2: #b4b4c0; --muted: #6c6c7a;
      --accent: #a78bfa; --accent-2: #60a5fa;
      --accent-grad: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --radius: 12px; --radius-sm: 8px;
      --chat-w: 440px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; color: inherit; }

    /* The whole dashboard becomes a flex container so the chat panel
       can sit beside it instead of overlapping. */
    .layout {
      display: flex;
      min-height: 100vh;
      transition: padding-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .layout.chat-open { padding-right: var(--chat-w); }

    .page-wrap {
      flex: 1; min-width: 0;
      transition: max-width 0.3s;
    }

    .page { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }

    /* ==================== Chat panel ==================== */
    .chat-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: var(--chat-w);
      background: var(--bg);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      display: flex; flex-direction: column;
    }
    .chat-panel.open { transform: translateX(0); }
    .chat-header {
      flex: 0 0 auto;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
    }
    .chat-header-title {
      font-weight: 600; font-size: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .chat-header-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 8px var(--success);
    }
    .chat-close {
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.15s;
    }
    .chat-close:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
    .chat-frame {
      flex: 1; min-height: 0;
      width: 100%; border: 0;
    }

    /* Floating "ask the data" toggle when chat is closed */
    .chat-fab {
      position: fixed;
      bottom: 24px; right: 24px;
      padding: 12px 18px;
      background: var(--accent-grad);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(167, 139, 250, 0.45);
      display: inline-flex; align-items: center; gap: 8px;
      transition: transform 0.15s, opacity 0.2s;
      z-index: 50;
    }
    .chat-fab:hover { transform: translateY(-2px); }
    .layout.chat-open .chat-fab { opacity: 0; pointer-events: none; transform: scale(0.8); }

    /* ==================== Header ==================== */
    header.dash-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .title-row { display: flex; align-items: center; gap: 14px; }
    .title-mark {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--accent-grad);
      display: grid; place-items: center;
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.35);
    }
    .title-text h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .title-text .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .title-text code {
      background: var(--surface-2); padding: 2px 6px;
      border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }

    .head-actions { display: flex; align-items: center; gap: 8px; }
    .icon-link {
      padding: 9px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 7px;
      transition: all 0.15s;
    }
    .icon-link:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .icon-link.primary {
      background: var(--accent-grad); border-color: transparent; color: white;
    }

    /* ==================== Filters ==================== */
    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 16px; align-items: end;
    }
    .filter { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .filter label {
      font-size: 11px; font-weight: 600;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .filter input, .filter select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px; font-size: 13px; width: 100%;
      outline: none; transition: border-color 0.15s;
    }
    .filter input:focus, .filter select:focus { border-color: var(--accent); }
    .date-range { display: flex; gap: 8px; }
    .date-range input { flex: 1; }

    .timeframe-bar {
      grid-column: 1 / -1;
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px; gap: 2px;
    }
    .timeframe-bar button {
      flex: 1; padding: 9px 14px;
      background: transparent; border: none; border-radius: 7px;
      color: var(--text-2); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .timeframe-bar button:hover { color: var(--text); }
    .timeframe-bar button.active {
      background: var(--accent-grad); color: white;
      box-shadow: 0 2px 8px rgba(167, 139, 250, 0.3);
    }

    /* ==================== KPIs ==================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px; margin-bottom: 18px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .kpi:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .kpi-label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 8px; font-weight: 600;
    }
    .kpi-value {
      font-size: 24px; font-weight: 700;
      letter-spacing: -0.02em; font-feature-settings: 'tnum';
      color: var(--text); line-height: 1.1;
    }
    .kpi.accent .kpi-value {
      background: var(--accent-grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .kpi-delta {
      margin-top: 10px;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
    }
    .kpi-delta.up   { color: var(--success); }
    .kpi-delta.down { color: var(--danger); }
    .kpi-delta.flat { color: var(--muted); }
    .kpi-delta .compare { color: var(--muted); font-weight: 400; margin-left: 2px; }
    .kpi-delta .prev    { color: var(--muted); font-weight: 400; }
    .kpi.invert .kpi-delta.up   { color: var(--danger); }
    .kpi.invert .kpi-delta.down { color: var(--success); }

    /* ==================== Tiles ==================== */
    .tiles {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px; margin-bottom: 14px;
    }
    .tiles-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px; margin-bottom: 14px;
    }
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      min-height: 320px;
    }
    .tile-header {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .tile-title {
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .tile-title svg { color: var(--accent); }
    .tile-meta { color: var(--muted); font-size: 11px; }
    .tile-body {
      flex: 1; min-height: 0;
      padding: 14px 18px;
      overflow: hidden;
    }
    .tile-body .vega-embed { width: 100% !important; }
    .tile-body svg, .tile-body canvas { max-width: 100%; height: auto !important; }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
      width: 100%; height: 100%; min-height: 200px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .empty-tile {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 30px;
      width: 100%;
    }

    table.top-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    table.top-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500; font-size: 10.5px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.top-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    table.top-table tr:last-child td { border-bottom: none; }
    table.top-table tr:hover td { background: var(--surface-2); }
    .num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .pill {
      display: inline-block;
      padding: 2px 7px;
      background: var(--surface-3);
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-2);
    }

    @media (max-width: 1300px) {
      .layout.chat-open { padding-right: 0; }
      .chat-panel.open { box-shadow: -16px 0 60px rgba(0, 0, 0, 0.7); }
    }
    @media (max-width: 1100px) {
      :root { --chat-w: 100vw; }
      .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tiles    { grid-template-columns: 1fr; }
      .tiles-3  { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .filters  { grid-template-columns: 1fr 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .kpi-value { font-size: 20px; }
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--surface-3); border-radius: 10px;
      border: 2px solid var(--bg);
    }
  </style>
</head>
<body>
  <div class="layout" id="layout">
    <div class="page-wrap">
      <div class="page">
        <header class="dash-head">
          <div class="title-row">
            <div class="title-mark">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
                <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
              </svg>
            </div>
            <div class="title-text">
              <h1>D2C Sales Dashboard</h1>
              <div class="sub">Live from <code>shopify.v_order_table</code> · <span id="period-label">last 30 days</span></div>
            </div>
          </div>
          <div class="head-actions">
            <button class="icon-link" id="open-chat-btn" onclick="openChat()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Open chat
            </button>
            <button class="icon-link primary" onclick="reload()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
              Refresh
            </button>
          </div>
        </header>

        <section class="filters">
          <div class="filter">
            <label>Date range</label>
            <div class="date-range">
              <input type="date" id="f-start">
              <input type="date" id="f-end">
            </div>
          </div>
          <div class="filter">
            <label>Platform</label>
            <select id="f-platform"><option value="">All</option></select>
          </div>
          <div class="filter">
            <label>Payment mode</label>
            <select id="f-payment"><option value="">All</option></select>
          </div>
          <div class="filter">
            <label>Shipment status</label>
            <select id="f-status"><option value="">All</option></select>
          </div>
          <div class="timeframe-bar" id="tf-bar">
            <button data-tf="day" class="active">Day</button>
            <button data-tf="week">Week</button>
            <button data-tf="month">Month</button>
            <button data-tf="quarter">Quarter</button>
            <button data-tf="year">Year</button>
          </div>
        </section>

        <section class="kpi-grid" id="kpis"></section>

        <section class="tiles">
          <div class="tile">
            <div class="tile-header">
              <div class="tile-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                Net Revenue Trend
              </div>
              <div class="tile-meta" id="series-meta">—</div>
            </div>
            <div class="tile-body" id="t-revenue"><div class="skeleton"></div></div>
          </div>

          <div class="tile">
            <div class="tile-header">
              <div class="tile-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/></svg>
                Revenue Leak
              </div>
              <div class="tile-meta">Gross → Net Delivered</div>
            </div>
            <div class="tile-body" id="t-waterfall"><div class="skeleton"></div></div>
          </div>
        </section>

        <section class="tiles-3">
          <div class="tile">
            <div class="tile-header"><div class="tile-title">Revenue by Platform</div></div>
            <div class="tile-body" id="t-platform"><div class="skeleton"></div></div>
          </div>
          <div class="tile">
            <div class="tile-header"><div class="tile-title">Revenue by Payment</div></div>
            <div class="tile-body" id="t-payment"><div class="skeleton"></div></div>
          </div>
          <div class="tile">
            <div class="tile-header"><div class="tile-title">Revenue by Customer Type</div></div>
            <div class="tile-body" id="t-customer"><div class="skeleton"></div></div>
          </div>
        </section>

        <section class="tiles" style="grid-template-columns: 1fr 1fr;">
          <div class="tile">
            <div class="tile-header"><div class="tile-title">Orders by Status</div></div>
            <div class="tile-body" id="t-status"><div class="skeleton"></div></div>
          </div>
          <div class="tile">
            <div class="tile-header"><div class="tile-title">Top Platform × Payment combinations</div></div>
            <div class="tile-body" id="t-top" style="padding:0;"><div class="skeleton" style="margin:18px;"></div></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- ============== Floating "Ask the data" button (visible when chat is closed) ============== -->
  <button class="chat-fab" onclick="openChat()" id="chat-fab">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Ask the data
  </button>

  <!-- ============== Slide-in chat panel ============== -->
  <aside class="chat-panel" id="chat-panel">
    <header class="chat-header">
      <div class="chat-header-title">
        <span class="dot"></span>
        <span>Data Agent</span>
      </div>
      <button class="chat-close" onclick="closeChat()" title="Close chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <iframe class="chat-frame" id="chat-frame" src="about:blank" title="Chat"></iframe>
  </aside>

  <script>
    // ---------- Chat panel control ----------
    const layoutEl = document.getElementById("layout");
    const chatPanel = document.getElementById("chat-panel");
    const chatFrame = document.getElementById("chat-frame");

    function openChat() {
      // Lazy-load the iframe only when first opened, so the dashboard is snappy
      if (chatFrame.src === "about:blank" || chatFrame.src.endsWith("about:blank")) {
        chatFrame.src = "/?embedded=1";
      }
      layoutEl.classList.add("chat-open");
      chatPanel.classList.add("open");
    }
    function closeChat() {
      layoutEl.classList.remove("chat-open");
      chatPanel.classList.remove("open");
    }
    // Esc closes the panel
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && chatPanel.classList.contains("open")) closeChat();
    });

    // ---------- Helpers ----------
    const $ = s => document.querySelector(s);
    const fmtINR = n => {
      if (n == null || isNaN(n)) return "—";
      const abs = Math.abs(n);
      if (abs >= 1e7) return "₹" + (n / 1e7).toFixed(2) + " Cr";
      if (abs >= 1e5) return "₹" + (n / 1e5).toFixed(2) + " L";
      if (abs >= 1e3) return "₹" + (n / 1e3).toFixed(1) + "K";
      return "₹" + Math.round(n).toLocaleString("en-IN");
    };
    const fmtNum = n => n == null ? "—" : Math.round(n).toLocaleString("en-IN");
    const fmtPct = n => n == null ? "—" : (n * 100).toFixed(1) + "%";
    const fmtDelta = n => {
      if (n == null) return "—";
      const v = n * 100;
      return (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
    };
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function daysAgoISO(d) {
      const dt = new Date(); dt.setDate(dt.getDate() - d);
      return dt.toISOString().slice(0, 10);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    }

    const state = {
      start_date: daysAgoISO(30),
      end_date: todayISO(),
      timeframe: "day",
      platform_types: null,
      payment_modes: null,
      statuses: null,
    };

    init();
    async function init() {
      $("#f-start").value = state.start_date;
      $("#f-end").value = state.end_date;

      $("#f-start").addEventListener("change", e => { state.start_date = e.target.value; reload(); });
      $("#f-end").addEventListener("change",   e => { state.end_date = e.target.value; reload(); });
      $("#f-platform").addEventListener("change", e => { state.platform_types = e.target.value ? [e.target.value] : null; reload(); });
      $("#f-payment").addEventListener("change",  e => { state.payment_modes  = e.target.value ? [e.target.value] : null; reload(); });
      $("#f-status").addEventListener("change",   e => { state.statuses       = e.target.value ? [e.target.value] : null; reload(); });

      document.querySelectorAll("#tf-bar button").forEach(b => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#tf-bar button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          state.timeframe = b.dataset.tf;
          reload();
        });
      });

      await Promise.all([loadFilterOptions(), reload()]);
    }

    async function loadFilterOptions() {
      try {
        const r = await fetch("/dashboard/filter-options");
        if (!r.ok) return;
        const data = await r.json();
        fillSelect("#f-platform", data.platforms || []);
        fillSelect("#f-payment",  data.payment_modes || []);
        fillSelect("#f-status",   data.statuses || []);
      } catch (e) { console.warn(e); }
    }

    function fillSelect(sel, options) {
      const el = $(sel);
      const current = el.value;
      el.innerHTML = `<option value="">All</option>` +
        options.filter(Boolean).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
      el.value = current;
    }

    async function reload() {
      $("#kpis").innerHTML = kpiSkeletons();
      ["#t-revenue","#t-waterfall","#t-platform","#t-payment","#t-customer","#t-status"]
        .forEach(s => { $(s).innerHTML = '<div class="skeleton"></div>'; });
      $("#t-top").innerHTML = '<div class="skeleton" style="margin:18px;"></div>';

      const params = new URLSearchParams({
        start_date: state.start_date, end_date: state.end_date, timeframe: state.timeframe,
      });
      (state.platform_types || []).forEach(v => params.append("platform_types", v));
      (state.payment_modes  || []).forEach(v => params.append("payment_modes", v));
      (state.statuses       || []).forEach(v => params.append("statuses", v));

      const periodDays = (new Date(state.end_date) - new Date(state.start_date)) / 86400000 + 1;
      $("#period-label").textContent = `last ${periodDays} day${periodDays === 1 ? "" : "s"}`;

      try {
        const res = await fetch(`/dashboard/d2c-sales?${params}`);
        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || `${res.status} ${res.statusText}`);
        }
        const data = await res.json();
        renderKpis(data.kpis);
        renderRevenueSeries(data.revenue_series);
        renderWaterfall(data.waterfall);
        renderBars("#t-platform", data.by_platform);
        renderBars("#t-payment",  data.by_payment_mode);
        renderBars("#t-customer", data.by_customer_type);
        renderBars("#t-status",   data.by_status, true);
        renderTopTable(data.top_dimensions);
      } catch (err) {
        console.error(err);
        document.querySelectorAll(".tile-body").forEach(el => {
          el.innerHTML = `<div class="empty-tile">Error: ${escapeHtml(err.message)}</div>`;
        });
      }
    }

    function kpiSkeletons() {
      return Array(5).fill(0).map(() => `
        <div class="kpi"><div class="kpi-label" style="opacity:0.4;">…</div>
        <div class="skeleton" style="height:30px;width:60%;border-radius:6px;min-height:30px;"></div></div>
      `).join("");
    }

    function renderKpis(k) {
      const c = k.current, p = k.previous, d = k.deltas;
      const cards = [
        { label: "Net Revenue",  value: fmtINR(c.net_revenue),  delta: d.net_revenue, prev: fmtINR(p.net_revenue),  accent: true,  invert: false },
        { label: "Total Orders", value: fmtNum(c.total_orders), delta: d.total_orders, prev: fmtNum(p.total_orders), accent: false, invert: false },
        { label: "AOV",          value: fmtINR(c.aov),          delta: d.aov,          prev: fmtINR(p.aov),          accent: false, invert: false },
        { label: "% Discount",   value: fmtPct(c.pct_discount), delta: d.pct_discount, prev: fmtPct(p.pct_discount), accent: false, invert: true },
        { label: "% Cancelled",  value: fmtPct(c.pct_cancelled),delta: d.pct_cancelled,prev: fmtPct(p.pct_cancelled),accent: false, invert: true },
      ];
      $("#kpis").innerHTML = cards.map(card => {
        const dv = card.delta;
        const cls = dv == null ? "flat" : (dv > 0.001 ? "up" : (dv < -0.001 ? "down" : "flat"));
        const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "─";
        return `
          <div class="kpi ${card.accent ? 'accent' : ''} ${card.invert ? 'invert' : ''}">
            <div class="kpi-label">${card.label}</div>
            <div class="kpi-value">${card.value}</div>
            <div class="kpi-delta ${cls}">
              ${arrow} ${fmtDelta(dv)}
              <span class="compare">${escapeHtml(k.compare_label || "")}</span>
            </div>
            <div class="kpi-delta flat" style="margin-top:2px;font-size:11px;font-weight:400;">
              <span class="prev">prev: ${card.prev}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRevenueSeries(rows) {
      const el = $("#t-revenue");
      if (!rows || !rows.length) { el.innerHTML = `<div class="empty-tile">No data for selected filters</div>`; return; }
      el.innerHTML = "";
      $("#series-meta").textContent = `${rows.length} ${state.timeframe}${rows.length>1?'s':''} · avg ${fmtINR(rows.reduce((a,r)=>a+(r.net_revenue||0),0)/rows.length)}`;

      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        data: { values: rows },
        autosize: { type: "fit", contains: "padding", resize: true },
        background: "transparent", height: 280,
        layer: [
          { mark: { type: "area",
                    line: { color: "#a78bfa", strokeWidth: 2.5 },
                    color: { x1:1,y1:1,x2:1,y2:0, gradient:"linear",
                             stops:[{offset:0,color:"rgba(167,139,250,0)"},{offset:1,color:"rgba(167,139,250,0.4)"}] } },
            encoding: {
              x: { field: "bucket", type: "temporal", title: null,
                   axis: { format: "%b %d", labelColor:"#b4b4c0", domainColor:"#383844", tickColor:"#383844" } },
              y: { field: "net_revenue", type: "quantitative", title: "Net revenue (INR)",
                   axis: { format:"~s", labelColor:"#b4b4c0", titleColor:"#b4b4c0",
                           gridColor:"#26262f", domainColor:"#383844", tickColor:"#383844" } },
              tooltip: [
                { field: "bucket", type: "temporal", title: "Date", format: "%b %d, %Y" },
                { field: "net_revenue", type: "quantitative", title: "Net revenue", format: ",.0f" },
                { field: "order_count", type: "quantitative", title: "Orders", format: "," },
              ],
            },
          },
          { mark: { type: "circle", size: 50, color: "#a78bfa" },
            encoding: {
              x: { field: "bucket", type: "temporal" },
              y: { field: "net_revenue", type: "quantitative" },
            },
          },
        ],
        config: { view: { stroke: "transparent" } },
      };
      vegaEmbed(el, spec, { actions: false, renderer: "svg" }).catch(e => console.error(e));
    }

    function renderWaterfall(stages) {
      const el = $("#t-waterfall");
      if (!stages || !stages.length) { el.innerHTML = `<div class="empty-tile">No data</div>`; return; }
      el.innerHTML = "";
      let running = 0;
      const data = stages.map((s, i) => {
        const isTotal = s.type === "start" || s.type === "total";
        const start = isTotal ? 0 : running;
        const end = isTotal ? s.value : running + s.value;
        if (!isTotal) running += s.value;
        else running = s.value;
        return { stage: s.stage, type: s.type, start, end, value: s.value, label: fmtINR(Math.abs(s.value)), order: i };
      });
      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        data: { values: data },
        autosize: { type: "fit", contains: "padding", resize: true },
        background: "transparent", height: 280,
        layer: [
          { mark: { type: "bar", size: 48, cornerRadiusEnd: 4 },
            encoding: {
              x: { field: "stage", type: "nominal", sort: { field: "order" }, title: null,
                   axis: { labelColor: "#ececf1", labelFontWeight: 500, domainColor:"#383844", tickColor:"#383844" } },
              y: { field: "start", type: "quantitative", title: "INR (post-GST)",
                   axis: { format: "~s", labelColor:"#b4b4c0", titleColor:"#b4b4c0", gridColor:"#26262f", domainColor:"#383844", tickColor:"#383844" } },
              y2: { field: "end" },
              color: {
                field: "type", type: "nominal",
                scale: { domain: ["start", "negative", "total"], range: ["#60a5fa", "#ef4444", "#10b981"] },
                legend: null,
              },
              tooltip: [
                { field: "stage", type: "nominal", title: "Stage" },
                { field: "value", type: "quantitative", title: "Amount", format: ",.0f" },
              ],
            },
          },
          { mark: { type: "text", dy: -10, color: "#ececf1", fontSize: 11, fontWeight: 600 },
            encoding: {
              x: { field: "stage", type: "nominal", sort: { field: "order" } },
              y: { field: "end", type: "quantitative" },
              text: { field: "label" },
            },
          },
        ],
        config: { view: { stroke: "transparent" } },
      };
      vegaEmbed(el, spec, { actions: false, renderer: "svg" }).catch(e => console.error(e));
    }

    function renderBars(sel, rows, useOrders=false) {
      const el = $(sel);
      if (!rows || !rows.length) { el.innerHTML = `<div class="empty-tile">No data</div>`; return; }
      el.innerHTML = "";
      const valField = useOrders ? "order_count" : "net_revenue";
      const valTitle = useOrders ? "Orders" : "Net Revenue";
      const data = rows.map(r => ({ ...r, label_text: useOrders ? fmtNum(r.order_count) : fmtINR(r.net_revenue) }));
      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        data: { values: data },
        autosize: { type: "fit", contains: "padding", resize: true },
        background: "transparent",
        height: { step: 32 },
        layer: [
          { mark: { type: "bar", cornerRadiusEnd: 4, color: "#a78bfa" },
            encoding: {
              y: { field: "label", type: "nominal", sort: { field: valField, order: "descending" }, title: null,
                   axis: { labelColor: "#ececf1", labelLimit: 140, labelFontWeight: 500, domainColor: "transparent", ticks: false } },
              x: { field: valField, type: "quantitative", title: valTitle,
                   axis: { format: "~s", labelColor: "#b4b4c0", titleColor: "#b4b4c0",
                           gridColor: "#26262f", domainColor: "transparent", tickColor: "transparent" } },
              tooltip: [
                { field: "label", type: "nominal", title: "Segment" },
                { field: "net_revenue", type: "quantitative", title: "Net revenue", format: ",.0f" },
                { field: "order_count", type: "quantitative", title: "Orders", format: "," },
              ],
            },
          },
          { mark: { type: "text", align: "left", dx: 6, color: "#ececf1", fontSize: 11, fontWeight: 600 },
            encoding: {
              y: { field: "label", type: "nominal", sort: { field: valField, order: "descending" } },
              x: { field: valField, type: "quantitative" },
              text: { field: "label_text" },
            },
          },
        ],
        config: { view: { stroke: "transparent" } },
      };
      vegaEmbed(el, spec, { actions: false, renderer: "svg" }).catch(e => console.error(e));
    }

    function renderTopTable(rows) {
      const el = $("#t-top");
      if (!rows || !rows.length) { el.innerHTML = `<div class="empty-tile">No data</div>`; return; }
      el.innerHTML = `
        <table class="top-table">
          <thead>
            <tr>
              <th>Platform</th><th>Payment</th>
              <th class="num">Net Revenue</th><th class="num">Orders</th>
              <th class="num">RTO</th><th class="num">Cancelled</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><span class="pill">${escapeHtml(r.platform || '—')}</span></td>
                <td><span class="pill">${escapeHtml(r.payment_mode || '—')}</span></td>
                <td class="num">${fmtINR(r.net_revenue)}</td>
                <td class="num">${fmtNum(r.order_count)}</td>
                <td class="num" style="color:${r.rto > 0 ? 'var(--danger)' : 'var(--muted)'};">${fmtNum(r.rto)}</td>
                <td class="num" style="color:${r.cancelled > 0 ? 'var(--warning)' : 'var(--muted)'};">${fmtNum(r.cancelled)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
